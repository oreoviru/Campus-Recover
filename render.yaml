services:
  - type: web
    name: campus-recover-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.database.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: campus-recover-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://frontend-ecru-gamma-87.vercel.app,https://frontend-bnfzszmsi-code-with-oreo.vercel.app
      - key: ALLOWED_EMAIL_DOMAINS
        value: rishihood.edu.in,nst.rishihood.edu.in
      - key: STORAGE_BACKEND
        value: local

databases:
  - name: campus-recover-db
    databaseName: campus_recover
    user: campus_user
