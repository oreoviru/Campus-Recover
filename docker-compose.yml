version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: campus_recover_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_recover
      POSTGRES_USER: campus_user
      POSTGRES_PASSWORD: campus_pass
    ports:
      - "5432:5432"
    volumes:
      - campus_recover_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_user -d campus_recover"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  campus_recover_data:
    driver: local
